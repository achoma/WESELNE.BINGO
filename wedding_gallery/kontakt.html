<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt — Anna Kitela | Coach Spełnionego Życia</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-main: #FDFCF9;
            --bg-accent: #F7F2EB;
            --text-main: #4A4A4A;
            --brand-accent: #A78C7B;
            --brand-hover: #8C7364;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Lora', serif;
            --font-nav: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.85;
            font-size: 17px;
        }

        /* STICKY HEADER */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(253, 252, 249, 0.94);
            backdrop-filter: blur(8px);
            z-index: 1000;
            border-bottom: 1px solid rgba(234, 222, 207, 0.5);
            padding: 18px 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 24px;
            color: var(--brand-accent);
            text-decoration: none;
            letter-spacing: 1px;
            font-weight: 500;
        }

        nav a {
            font-family: var(--font-nav);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--text-main);
            margin-left: 20px;
            transition: color 0.3s;
            font-weight: 500;
        }

        nav a.active,
        nav a:hover {
            color: var(--brand-accent);
        }

        /* BUTTONS & INPUTS */
        .btn {
            display: inline-block;
            width: 100%;
            font-family: var(--font-nav);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            background-color: var(--brand-accent);
            color: #FFF;
            padding: 18px 36px;
            border-radius: 4px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--brand-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(167, 140, 123, 0.2);
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-field,
        textarea.input-field {
            width: 100%;
            padding: 16px 20px;
            font-family: var(--font-nav);
            font-size: 13px;
            border: 1px solid #EADECF;
            border-radius: 4px;
            background-color: #FDFCF9;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus,
        textarea.input-field:focus {
            border-color: var(--brand-accent);
        }

        textarea.input-field {
            height: 140px;
            resize: vertical;
            grid-column: span 2;
        }

        /* TYPOGRAPHY */
        .tagline {
            font-family: var(--font-nav);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--brand-hover);
            margin-bottom: 12px;
            display: block;
            font-weight: 600;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 3.2rem;
            line-height: 1.25;
            color: var(--brand-accent);
            margin-bottom: 10px;
            font-weight: 400;
        }

        h2 {
            font-family: var(--font-heading);
            font-size: 2.4rem;
            color: var(--brand-accent);
            margin-bottom: 25px;
            font-weight: 400;
        }

        /* LAYOUT & SEKCJE */
        section {
            padding: 100px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .full-width {
            max-width: 100%;
            background-color: var(--bg-accent);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: start;
        }

        /* HERO */
        .hero-kontakt {
            padding-top: 140px;
            padding-bottom: 60px;
            text-align: center;
            background-color: var(--bg-accent);
        }

        /* FORM CARD */
        .form-card {
            background: #FFFFFF;
            border: 1px solid #EADECF;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(167, 140, 123, 0.07);
        }

        /* INFO BOX */
        .contact-item {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .icon-box {
            width: 50px;
            height: 50px;
            background-color: var(--bg-accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--brand-accent);
            font-size: 20px;
            flex-shrink: 0;
        }

        .info-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: var(--brand-accent);
            margin-bottom: 3px;
        }

        .info-val {
            font-size: 1rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .info-val:hover {
            color: var(--brand-accent);
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            background-color: var(--brand-accent);
            color: #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.3s;
            font-size: 14px;
            font-weight: bold;
        }

        .social-icon:hover {
            background-color: var(--brand-hover);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            h2 {
                font-size: 1.8rem;
            }

            .grid-2 {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .input-group {
                grid-template-columns: 1fr;
            }

            textarea.input-field {
                grid-column: span 1;
            }

            section {
                padding: 60px 20px;
            }

            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER STICKY -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">ANNA KITELA</a>
            <nav>
                <a href="index.html">Strona główna</a>
                <a href="o-mnie.html">O mnie</a>
                <a href="pomagam.html">Pomagam</a>
                <a href="proces.html">Proces pracy</a>
                <a href="oferta.html">Oferta</a>
                <a href="blog.html">Blog</a>
                <a href="kontakt.html" class="active">Kontakt</a>
            </nav>
        </div>
    </header>

    <!-- SEKCJA 1: HERO PODSTRONY KONTAKT (TREŚĆ 1:1) -->
    <div class="hero-kontakt">
        <span class="tagline">Anna Kitela- coach spełnionego życia</span>
        <h1>Kontakt</h1>
    </div>

    <!-- SEKCJA 2: FORMULARZ I DANE KONTAKTOWE (TREŚĆ 1:1) -->
    <section class="grid-2">
        <!-- KOLUMNA 1: FORMULARZ -->
        <div class="form-card">
            <form action="#" method="POST">
                <div class="input-group">
                    <input type="text" name="name" class="input-field" placeholder="Twoje imię" required>
                    <input type="email" name="email" class="input-field" placeholder="Adres e-mail" required
                        autocomplete="email">
                </div>
                <div class="input-group">
                    <input type="tel" name="phone" class="input-field" placeholder="Telefon kontaktowy">
                    <input type="text" name="subject" class="input-field" placeholder="Temat">
                </div>
                <div style="margin-bottom: 25px;">
                    <textarea name="message" class="input-field" placeholder="Wiadomość" required></textarea>
                </div>
                <button type="submit" class="btn">WYŚLIJ WIADOMOŚĆ ✈</button>
            </form>
        </div>

        <!-- KOLUMNA 2: DANE KONTAKTOWE -->
        <div style="padding-top: 10px;">
            <span class="tagline">Wracam do siebie. I to wystarczy.</span>
            <h2>Dane kontaktowe</h2>

            <div class="contact-item">
                <div class="icon-box">📞</div>
                <div>
                    <div class="info-title">Telefon kontaktowy:</div>
                    <a href="tel:+48608142741" class="info-val">(+48) 608 142 741</a>
                </div>
            </div>

            <div class="contact-item">
                <div class="icon-box">✉</div>
                <div>
                    <div class="info-title">Adres e-mail:</div>
                    <a href="mailto:kontakt@annakitela.pl" class="info-val">kontakt@annakitela.pl</a>
                </div>
            </div>

            <div class="social-links">
                <a href="#" class="social-icon" title="Instagram">IG</a>
                <a href="#" class="social-icon" title="Facebook">FB</a>
            </div>
        </div>
    </section>

    <!-- FOOTER (TREŚĆ 1:1) -->
    <footer
        style="text-align: center; padding: 30px 20px; font-family: var(--font-nav); font-size: 11px; color: #888; border-top: 1px solid #EADECF; background-color: var(--bg-accent);">
        @ COPYRIGHT 2026 ANNAKITELA.COM
    </footer>

</body>

</html>
