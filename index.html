<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow"> 
    <title>Szykuje się coś ekstra! | Strona w budowie</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-color: #c99999;
            --font-main: 'Helvetica Neue', Arial, sans-serif;
            --bg-color: #FAFAF8;
            --text-main: #333333;
            --text-light: #666666;
            --accent-pink: #C29B9B;
            --button-pink: #c99999;
            --button-hover: #926a6a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .maintenance-container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 1.2s ease-in-out;
        }

        .logo-wrapper {
            margin-bottom: 2.5rem;
        }

        .logo-wrapper img {
            max-width: 280px;
            height: auto;
            display: inline-block;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.3;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            font-weight: 300;
            color: rgb(83, 83, 83);
            letter-spacing: 0.01em;
            padding-bottom: 4px;
        }
        span{
            font-size: 1.1rem;
            font-weight: 500;
        }
        .description {
            font-size: 1rem;
            line-height: 1.8;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--button-pink);
            color: #FFFFFF;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s ease, transform 0.3s ease;
            margin-bottom: 40px;
        }

        .cta-button:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
        }

        .footer-note {
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: var(--accent-pink);
            font-weight: 500;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.75rem;
            }

            p {
                font-size: 1rem;
            }

            .logo-wrapper img {
                max-width: 180px;
            }
            .description {
                font-size: 0.9rem;
            }
        }

    </style>
</head>

<body>

    <b class="maintenance-container">

        <div class="logo-wrapper">
            <img src="/images/weselne.bingo.png" alt="Logo" >
        </div>

        <h1>Premiera wkrótce</h1>
<div class="description">
    <p>Cyfrowa alternatywa dla tradycyjnych zabaw.</p>
    <p>Subtelna integracja, nowoczesny design i zero kompromisów.</p>
    <p>Tworzymy interaktywne gry online dla najbardziej wymagających gości.</p>
</div>

<a href="/demo/index.html" class="cta-button">Przetestuj Demo</a>

<div class="footer-note">
    <p>Trwają prace deweloperskie.</p>
</div>
    </main>

</body>

</html>
